# Kursy ETF-ów i walut NBP dla skarbonek z ETF-em (PLAN.md, krok 9.4).
# Czyta Yahoo Finance i API NBP, zapisuje etf_data.json i commituje go
# tylko wtedy, gdy dane się zmieniły.
name: Kursy ETF

on:
  schedule:
    # Pon–pt 22:15 UTC: po zamknięciu GPW, giełd europejskich i Nowego Jorku,
    # więc w pliku jest już kurs zamknięcia z tego dnia.
    - cron: "15 22 * * 1-5"
  workflow_dispatch: # ręczne uruchomienie z zakładki Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pobierz kursy
        run: python fetch_etf.py etf_data.json
      - name: Zapisz zmiany
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add etf_data.json
          if git diff --cached --quiet; then
            echo "Bez zmian"
          else
            git commit -m "Kursy ETF $(date +%F)"
            git push
          fi
